[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reimap"
version = "1.0.0"
description = "Watch your machine reach across the internet in real time — a local-first network map with a first-class extensibility hook system."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Batuhan Ayrıbaş", email = "hello@batuhanayribas.com" },
    { name = "Rootcastle", email = "hello@rootcastle.com" },
]
maintainers = [
    { name = "Batuhan Ayrıbaş", email = "hello@batuhanayribas.com" },
]
keywords = [
    "network",
    "visualization",
    "geoip",
    "sockets",
    "security",
    "observability",
    "dashboard",
    "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]
dependencies = [
    "dash>=2.14",
    "plotly>=5.18",
    "psutil>=5.9",
    "geoip2>=4.7",
    "maxminddb>=2.4",
    "platformdirs>=3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://batuhanayribas.com"
Organization = "https://rootcastle.com"
Repository = "https://github.com/rootcastleco/reimap"
Issues = "https://github.com/rootcastleco/reimap/issues"

[project.scripts]
reimap = "reimap.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reimap = ["assets/*", "assets/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]
# RUF001-003: allow Turkish characters (e.g. "Ayrıbaş") used in branding strings.
ignore = ["D100", "D104", "D105", "D107", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
# The UI modules embed CSS/HTML string literals where wrapping hurts readability.
"src/reimap/ui/layout.py" = ["E501"]
"src/reimap/ui/panels.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
